<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>JOY CORPORATION</title>
<style>
:root{--bg:#E8EDF0;--card:#fff;--ink:#1F2A33;--mut:#5d6b76;--navy:#1E3A5F;--brass:#B8892B;--line:#cdd6dc;--ok:#2f7d4f;--bad:#a83a3a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,h3{font-family:Georgia,serif;margin:0}
header{background:var(--navy);color:#fff;padding:12px 16px}
header h1{font-size:20px;letter-spacing:.5px}header small{color:#d8c28a;font-style:italic}
main{flex:1;overflow-y:auto;padding:14px 14px 20px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--brass)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink);margin:4px 0 8px}
textarea{min-height:90px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{white-space:nowrap;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px}
.chips button.on{background:var(--navy);color:#fff}
.msg{white-space:pre-wrap;word-wrap:break-word;padding:10px 12px;border-radius:10px;margin:8px 0;max-width:94%}
.msg.u{background:var(--navy);color:#fff;margin-left:auto}.msg.a{background:var(--card);border:1px solid var(--line)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .4s}
.mut{color:var(--mut);font-size:14px}.pre{white-space:pre-wrap;word-wrap:break-word;font-size:15px}
details{margin:6px 0}summary{font-weight:600;color:var(--navy)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;background:var(--mut)}.tag.ok{background:var(--ok)}.tag.bad{background:var(--bad)}.tag.quota{background:var(--brass)}.tag.model{background:var(--bad)}
#lock{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;padding:20px;text-align:center}
#lock input{width:200px;text-align:center;font-size:24px;letter-spacing:8px}
.err{color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="lock"><h1>JOY CORPORATION</h1><small style="color:#d8c28a;font-style:italic">Kami ada karena kamu Ade</small>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="btn" style="background:var(--brass)" id="go">Buka kantor</button><div id="lerr" class="err"></div></div>
<header><h1>JOY CORPORATION</h1><small>Kami ada karena kamu Ade</small></header>
<main id="m"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let S;try{S=JSON.parse(localStorage.getItem('jc'))||{}}catch(e){S={}}
S.pin=S.pin||'1234';S.keys=S.keys||[];if(S.key){S.keys.push({id:Date.now(),pv:'gemini',key:S.key,model:S.model||'gemini-2.5-flash',st:'',msg:'',chk:''});S.active=S.keys[0].id;delete S.key;delete S.model}S.active=S.active||null;S.work=S.work||{target:3,niche:'',day:'',done:0};S.work.on=false;S.work.mode=S.work.mode||'auto';S.log=S.log||[];S.assets=S.assets||[];S.sales=S.sales||[];S.chat=S.chat||{};
const save=()=>{try{localStorage.setItem('jc',JSON.stringify(S))}catch(e){}};
const DIV={
riset:['Riset & Analisis Pasar','Head of Research. Cari tren pasar global (AS/Eropa), bedah masalah pembeli, analisis kompetitor, tentukan harga jual dalam USD.'],
produk:['Produk & Produksi','Lead Product Creator. Rancang blueprint produk digital dan tulis isi materi (e-book/template/panduan) berbahasa Inggris berkualitas tinggi.'],
marketing:['Pemasaran & Penjualan','Chief Marketing Officer. Susun sales page persuasif untuk Gumroad/Etsy/Lemon Squeezy dan naskah konten promosi organik.'],
finance:['Finance','Kepala Finance. Catat hasil penjualan, tentukan harga produk digital, rekap pendapatan. Pembayaran diproses platform dan dikirim ke rekening owner; kamu tidak memproses uang.'],
qa:['Kontrol Kualitas','Quality Assurance. Kritik tajam dan perbaiki setiap hasil kerja sebelum diserahkan ke owner.']};
const SYS=d=>`Kamu adalah ${DIV[d][0]} di Joy Corporation. ${DIV[d][1]} Owner/CEO tidak paham bahasa Inggris: penjelasan dan laporan ditulis dalam Bahasa Indonesia, sedangkan materi untuk pembeli ditulis dalam bahasa Inggris lalu diberi ringkasan Indonesia. Hasil konkret, siap pakai, tanpa basa-basi. Jangan mengarang data pasar sebagai fakta pasti; tandai sebagai perkiraan. Akhiri dengan "Rekomendasi Langkah Berikutnya".`;
const PV={gemini:{n:'Google Gemini',m:['gemini-2.5-flash','gemini-2.5-pro','gemini-2.0-flash']},groq:{n:'Groq',m:['llama-3.3-70b-versatile','llama-3.1-8b-instant']},claude:{n:'Claude (Anthropic)',m:['claude-sonnet-5-5','claude-haiku-5-5','claude-opus-5-5']},hf:{n:'Hugging Face',m:['meta-llama/Llama-3.3-70B-Instruct','Qwen/Qwen2.5-72B-Instruct']},openai:{n:'OpenAI',m:['gpt-4o-mini','gpt-4o']},custom:{n:'Lainnya (kompatibel OpenAI)',m:[]}};
const BASE={openai:'https://api.openai.com/v1',groq:'https://api.groq.com/openai/v1',hf:'https://router.huggingface.co/v1'};
const base=k=>k.pv==='custom'?(k.url||'').replace(/\/+$/,''):BASE[k.pv];
const CH={'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
const aktif=()=>S.keys.find(x=>x.id===S.active);
const AUTH=(r,m)=>r.status===401||r.status===403||/expired|not valid|invalid.*key|invalid x-api-key/i.test(String(m));
function errMsg(r,j){
 const m=(j&&j.error&&(j.error.message||j.error))||'Gagal menghubungi AI';
 if(AUTH(r,m))return 'Kunci API ditolak (tidak valid atau kadaluarsa). Ganti kunci di Setelan. Detail: '+m;
 if(/model/i.test(String(m))&&/not exist|not found|no access|does not/i.test(String(m)))return 'Nama model salah atau tidak bisa diakses. Buka Setelan, tekan Ubah model pada kunci yang dipakai. Detail: '+m;
 if(r.status===429)return 'Kuota kunci ini habis atau terlalu banyak permintaan. Coba kunci lain di Setelan.';
 return String(m);
}
function fail(k,r,j){
 const e=new Error(errMsg(r,j));
 if(AUTH(r,(j&&j.error&&(j.error.message||j.error))||'')){k.st='bad';k.msg='Ditolak saat dipakai: tidak valid atau kadaluarsa.';k.chk=new Date().toLocaleString('id-ID');save()}
 return e;
}
async function ai(system,contents){
 try{return await ai0(system,contents)}catch(e){
  if(e instanceof TypeError||/failed to fetch|networkerror|load failed/i.test(e.message))throw new Error('Tidak bisa terhubung ke penyedia AI. Penyebab umum: internet mati, atau aplikasi dibuka dari pratinjau di chat Claude (jaringan dan kotak dialog diblokir di sana). Buka lewat ikon aplikasi di HP atau alamat GitHub Pages Anda.');
  throw e}
}
async function ai0(system,contents){
 const k=aktif();
 if(!k)throw new Error('Belum ada kunci API aktif. Tambahkan dan pilih kunci di tab Setelan.');
 let r,j;
 if(k.pv==='gemini'){
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${k.model}:generateContent?key=${encodeURIComponent(k.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents})});
  j=await r.json();
  if(!r.ok)throw fail(k,r,j);
  const t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
  if(!t)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
  return t.map(p=>p.text||'').join('');
 }
 const msgs=contents.map(c=>({role:c.role==='model'?'assistant':'user',content:c.parts[0].text}));
 if(k.pv==='claude'){
  r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:Object.assign({'Content-Type':'application/json','x-api-key':k.key},CH),body:JSON.stringify({model:k.model,max_tokens:8000,system,messages:msgs})});
  j=await r.json();
  if(!r.ok)throw fail(k,r,j);
  const t=(j.content||[]).map(p=>p.text||'').join('');
  if(!t)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
  return t;
 }
 const b=base(k);if(!b)throw new Error('Alamat API kunci ini kosong. Hapus lalu tambahkan ulang.');
 r=await fetch(b+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k.key},body:JSON.stringify({model:k.model,messages:[{role:'system',content:system}].concat(msgs)})});
 j=await r.json();
 if(!r.ok)throw fail(k,r,j);
 const c=j.choices&&j.choices[0]&&j.choices[0].message;
 if(!c)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
 return c.content||'';
}
async function cek(k){
 try{
  let r;
  if(k.pv==='gemini')r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(k.key));
  else if(k.pv==='claude')r=await fetch('https://api.anthropic.com/v1/models?limit=1',{headers:Object.assign({'x-api-key':k.key},CH)});
  else if(k.pv==='hf')r=await fetch('https://huggingface.co/api/whoami-v2',{headers:{Authorization:'Bearer '+k.key}});
  else{const b=base(k);if(!b)return ['bad','Alamat API belum diisi.'];r=await fetch(b+'/models',{headers:{Authorization:'Bearer '+k.key}})}
  if(r.ok){
   if(k.pv!=='claude'&&k.pv!=='hf'){
    let ids=[];try{const j=await r.clone().json();ids=(j.data||j.models||[]).map(x=>String(x.id||x.name||'').replace(/^models\//,''))}catch(e){}
    if(ids.length&&!ids.includes(k.model))return ['model','Kunci valid, tetapi model "'+k.model+'" tidak ada di akun ini. Tekan Ubah model lalu isi nama model yang benar.'];
   }
   return ['ok','Kunci dan model valid, siap dipakai.'];
  }
  if(r.status===429)return ['quota','Kunci dikenali tetapi kuota habis atau terlalu banyak permintaan.'];
  if(r.status===400||r.status===401||r.status===403)return ['bad','Kunci tidak valid, salah salin, atau sudah kadaluarsa/dicabut.'];
  if(r.status===404)return ['net','Alamat API tidak ditemukan (kode 404). Periksa alamat yang diisi.'];
  return ['net','Pengecekan gagal (kode '+r.status+'). Coba lagi nanti.'];
 }catch(e){return ['net','Tidak bisa terhubung. Periksa internet atau alamat API, lalu coba lagi.']}
}
const copy=async t=>{try{await navigator.clipboard.writeText(t);alert('Tersalin')}catch(e){alert('Salin manual: tekan lama teks')}};
// ---- tabs
const TABS=[['kantor','Kantor'],['request','Request'],['aset','Aset'],['log','Log'],['uang','Keuangan'],['set','Setelan']];
let tab='kantor',cur='riset',busy=false,prog={p:0,t:'',on:false};
function nav(){const n=$('#nav');n.innerHTML='';TABS.forEach(([k,l])=>{const b=el('button',k===tab?'on':'',l);b.onclick=()=>{tab=k;nav();draw()};n.append(b)})}
function draw(){const m=$('#m');m.innerHTML='';({kantor,request,aset,log:logTab,uang,set:setelan})[tab](m);}
// ---- kantor
function kantor(m){
 const ch=el('div','chips');Object.keys(DIV).forEach(k=>{const b=el('button',k===cur?'on':'','@'+DIV[k][0]);b.onclick=()=>{cur=k;draw()};ch.append(b)});m.append(ch);
 const h=S.chat[cur]=S.chat[cur]||[];
 if(!h.length)m.append(el('div','mut','Ketik perintah untuk divisi '+DIV[cur][0]+'. Contoh: "cari 3 ide produk digital yang cepat laku di AS".'));
 h.forEach(x=>m.append(el('div','msg '+(x.role==='user'?'u':'a'),x.parts[0].text)));
 const ta=el('textarea');ta.placeholder='Perintah untuk '+DIV[cur][0];
 const row=el('div','row');const send=el('button','btn','Kirim');const clr=el('button','btn alt','Hapus chat');
 row.append(send,clr);m.append(ta,row);
 clr.onclick=()=>{S.chat[cur]=[];save();draw()};
 send.onclick=async()=>{const t=ta.value.trim();if(!t||busy)return;busy=true;send.disabled=true;send.textContent='Divisi bekerja...';
  h.push({role:'user',parts:[{text:t}]});
  try{const a=await ai(SYS(cur),h.slice(-12));h.push({role:'model',parts:[{text:a}]})}catch(e){h.pop();alert(e.message)}
  busy=false;save();draw();m.scrollTop=m.scrollHeight};
}
// ---- request produk (pipeline)
const STAGES=[
['Riset pasar','riset',(r,o)=>`Request produk dari CEO: "${r}".\nLakukan analisis pasar AS/Eropa: siapa pembelinya, masalah utama mereka, 3 tipe kompetitor dan kelemahannya, celah peluang, dan harga jual USD yang disarankan (tandai sebagai perkiraan). Ringkas dan padat.`],
['Produksi produk','produk',(r,o)=>`Request: "${r}".\nHasil riset:\n${o.riset}\n\nBuat produk digital lengkap, siap dijual, isi dalam bahasa Inggris berkualitas tinggi (judul, struktur, seluruh isi materi). Lalu satu paragraf ringkasan Indonesia.`],
['Kontrol kualitas','qa',(r,o)=>`Kritik produk ini dengan sangat ketat (kejelasan, nilai bagi pembeli, tata bahasa, kesalahan fakta, janji berlebihan). Mulai dengan baris "SKOR: x/10" dan daftar masalah dalam Bahasa Indonesia. Setelah itu tulis satu baris persis =====FINAL===== lalu VERSI FINAL produk yang sudah diperbaiki, seluruhnya dalam bahasa Inggris, tanpa komentar tambahan.\n\nProduk:\n${o.produk}`],
['Sales page & konten','marketing',(r,o)=>`Berdasarkan produk final ini, tulis dalam bahasa Inggris: (1) sales page siap tempel di Gumroad (judul, subjudul, 5 poin manfaat, deskripsi, isi paket, FAQ singkat, ajakan beli), (2) 3 naskah video pendek TikTok/Reels. Tambahkan ringkasan Indonesia.\n\nProduk final:\n${o.fin}`],
['Harga & ringkasan','finance',(r,o)=>`Tentukan harga final dalam USD dengan alasan singkat berdasarkan riset ini, dan buat RINGKASAN INDONESIA maksimal 10 baris yang menjelaskan seluruh produk, siapa pembelinya, dan cara menjualnya. Riset:\n${o.riset}\n\nSales page:\n${o.marketing}`]];
let wk={run:false,stop:false},wakeLock=null;
const logAdd=(who,msg)=>{S.log.push({t:Date.now(),w:who,m:String(msg).slice(0,300)});if(S.log.length>300)S.log=S.log.slice(-300);save();if(tab==='log')draw()};
async function waitStop(sec){for(let i=0;i<sec&&!wk.stop;i++)await new Promise(r=>setTimeout(r,1000))}
async function aiR(sys,c){for(let i=0;;i++){try{return await ai(sys,c)}catch(e){
 if(/kuota|429|rate|batas/i.test(e.message)&&i<2&&!wk.stop){logAdd('Sistem','Kena batas pemakaian. Menunggu 45 detik lalu mengulang ('+(i+1)+'/2).');setMsg('Menunggu batas pemakaian reset (45 detik)...');await waitStop(45);if(wk.stop)throw new Error('STOP');continue}
 throw e}}}
const hari=()=>new Date().toLocaleDateString('id-ID');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const setMsg=(t,p)=>{prog={p:p==null?prog.p:p,t:t,on:true};paint()};
async function lock(on){try{if(on&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');else if(wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
async function produce(r){
 const o={};
 for(let i=0;i<STAGES.length;i++){const [n,d,f]=STAGES[i];
  if(wk.stop)throw new Error('STOP');
  logAdd(DIV[d][0],'Mulai: '+n+' ('+r.slice(0,40)+')');
  setMsg((wk.run?'WORKING | ':'')+r.slice(0,45)+' | Tahap '+(i+1)+'/6: '+n+'...',Math.round(i/(STAGES.length+1)*100));
  o[d]=await aiR(SYS(d),[{role:'user',parts:[{text:f(r,o)}]}]);
  logAdd(DIV[d][0],'Selesai: '+n);
  if(d==='qa')o.fin=(o.qa.split(/=+\s*FINAL\s*=+/i)[1]||'').trim()||o.qa}
 if(wk.stop)throw new Error('STOP');
 setMsg((wk.run?'WORKING | ':'')+r.slice(0,45)+' | Tahap 6/6: Paket Gumroad dan sampul...',Math.round(STAGES.length/(STAGES.length+1)*100));
 logAdd(DIV.marketing[0],'Mulai: paket Gumroad dan sampul');o.gr=await aiR(SYS('marketing'),[{role:'user',parts:[{text:GRP(r,o)}]}]);logAdd(DIV.marketing[0],'Selesai: paket Gumroad dan sampul dibuat');
 const sk=(o.qa.match(/SKOR:\s*([\d.]+)\/10/i)||[])[1]||'-';
 S.assets.unshift({id:Date.now(),title:r.slice(0,70),date:hari(),skor:sk,riset:o.riset,produk:o.qa,final:o.fin,gr:parseGr(o.gr,r),marketing:o.marketing,ringkas:o.finance,ok:false,link:''});save();logAdd(DIV.qa[0],'Skor QA '+sk+'/10 untuk: '+r.slice(0,50));logAdd('Sistem','Produk masuk tab Aset: '+r.slice(0,50));
}
async function working(){
 if(wk.run||busy)return;
 if(S.work.mode==='request'&&!S.work.niche){alert('Mode Request: isi dulu arah atau jenis produknya.');return}
 wk.run=true;wk.stop=false;busy=true;await lock(true);draw();logAdd('Sistem','WORKING dimulai ('+(S.work.mode==='request'?'Request: '+S.work.niche:'Otomatis, riset pasar global')+'). Target: '+S.work.target+' produk.');
 try{
  while(!wk.stop){
   if(S.work.day!==hari()){S.work.day=hari();S.work.done=0;save()}
   if(S.work.done>=S.work.target){logAdd('Sistem','Target '+S.work.target+' produk tercapai.');setMsg('Target hari ini ('+S.work.target+' produk) tercapai. Periksa hasilnya di tab Aset.',100);break}
   setMsg('WORKING | Riset: mencari ide produk ke-'+(S.work.done+1)+'...',0);
   const have=S.assets.slice(0,30).map(a=>a.title).join('; ');
   const raw=await aiR(SYS('riset'),[{role:'user',parts:[{text:'Berdasarkan riset tren pasar global (AS/Eropa), pilih 1 ide produk digital baru yang cepat laku'+(S.work.mode==='request'&&S.work.niche?' dengan arah: '+S.work.niche:'')+'. Pilih topik atau kategori yang jelas berbeda dari produk yang sudah ada. Hindari ide yang mirip dengan: '+(have||'(belum ada)')+'. Balas HANYA 1 baris berisi ide produk dalam bahasa Inggris, tanpa penjelasan.'}]}]);
   const idea=raw.trim().split('\n')[0].replace(/^[\s\-*"]+/,'').replace(/^\d+[.)]\s+/,'').replace(/["\s]+$/,'').slice(0,120);
   if(!idea)throw new Error('Ide produk kosong, coba lagi.');
   logAdd(DIV.riset[0],'Ide produk dipilih: '+idea);
   await produce(idea);S.work.done++;save();
   setMsg('Produk selesai: '+idea.slice(0,50)+' ('+S.work.done+'/'+S.work.target+' hari ini)',100);
   await sleep(2500);
  }
 }catch(e){logAdd('Sistem',e.message==='STOP'?'WORKING dihentikan oleh CEO.':'Berhenti karena error: '+e.message);if(e.message!=='STOP')setMsg('Berhenti: '+e.message);else setMsg('Working dihentikan.',prog.p)}
 wk.run=false;busy=false;await lock(false);if(tab==='request')draw();
}
function request(m){
 m.append(el('h3',null,'Request Produk'));
 const w=el('div','card');w.append(el('b',null,'Mode WORKING (otomatis)'));
 w.append(el('div','mut','Sekali tekan: AI mencari ide, membuat produk, QA, sales page, dan harga, berulang sampai target hari ini. Hasil masuk tab Aset dan menunggu persetujuan Anda.'));
 const mr=el('div','row');mr.style.margin='8px 0';
 const mk=(k,l)=>{const b=el('button','btn sm'+(S.work.mode===k?'':' alt'),l);b.disabled=wk.run;b.onclick=()=>{S.work.mode=k;save();draw()};return b};
 mr.append(mk('auto','Otomatis (riset pasar global)'),mk('request','Request'));
 const ni=el('input');ni.placeholder='Tulis arah/jenis produk, mis. template untuk guru';ni.value=S.work.niche||'';ni.onchange=()=>{S.work.niche=ni.value.trim();save()};
 const tl=el('div','mut','Target produk per hari (1 sampai 20):');

function coverCanvas(a){
 const g=gFor(a);const c=document.createElement('canvas');c.width=1280;c.height=720;const x=c.getContext('2d');
 x.fillStyle='#1E3A5F';x.fillRect(0,0,1280,720);
 x.fillStyle='#B8892B';x.fillRect(70,70,140,8);x.fillRect(0,700,1280,20);
 x.textBaseline='top';x.fillStyle='#fff';
 let sz=88,L;for(;;){x.font='bold '+sz+'px Georgia,serif';L=wrapT(x,g.title,1140);if(L.length<=3||sz<=46)break;sz-=6}
 let y=110;L.forEach(l=>{x.fillText(l,70,y);y+=sz*1.15});y+=14;
 if(g.sub){x.fillStyle='#d8c28a';x.font='italic 36px Georgia,serif';wrapT(x,g.sub,1140).slice(0,2).forEach(l=>{x.fillText(l,70,y);y+=46})}
 y+=22;x.fillStyle='#fff';x.font='30px system-ui,sans-serif';
 (g.bullets||[]).slice(0,3).forEach(b=>{x.fillText('\u2022  '+b,70,y);y+=44});
 x.fillStyle='#B8892B';x.font='bold 24px system-ui,sans-serif';x.fillText('JOY CORPORATION',70,652);
 return c;
}

async function makePdf(a){
 const {jsPDF}=await pdfLib();const d=new jsPDF({unit:'pt',format:'a4'});const g=gFor(a);
 const W=595,H=842,M=54,MW=W-2*M;
 d.setFillColor(30,58,95);d.rect(0,0,W,H,'F');
 d.setTextColor(255,255,255);d.setFont('times','bold');d.setFontSize(32);
 let y=220;d.splitTextToSize(cl(g.title),MW).forEach(l=>{d.text(l,M,y);y+=40});
 if(g.sub){d.setFont('times','italic');d.setFontSize(16);d.setTextColor(216,194,138);y+=10;d.splitTextToSize(cl(g.sub),MW).forEach(l=>{d.text(l,M,y);y+=22})}
 d.setFont('helvetica','bold');d.setFontSize(12);d.setTextColor(184,137,43);d.text('JOY CORPORATION',M,H-60);
 d.addPage();d.setTextColor(31,42,51);y=M;
 cl(a.final||a.produk).split('\n').forEach(raw=>{
  let t=raw.trim();const h=/^#{1,3}\s/.test(t);
  if(h){t=t.replace(/^#{1,3}\s+/,'');d.setFont('helvetica','bold');d.setFontSize(15);y+=8}
  else{d.setFont('helvetica','normal');d.setFontSize(11);t=t.replace(/^[*\-]\s+/,'- ')}
  if(!t){y+=8;return}
  d.splitTextToSize(t,MW).forEach(l=>{if(y>H-M){d.addPage();y=M}d.text(l,M,y);y+=h?20:15});
  if(h)y+=2;
 });
 return d.output('blob');
}

 fi.onchange=()=>{const fl=fi.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.assets)||!Array.isArray(d.sales))throw 0;if(!confirm('Timpa data sekarang dengan cadangan ini?'))return;S.assets=d.assets;S.sales=d.sales;S.chat=d.chat||{};save();draw();alert('Data dipulihkan')}catch(e){alert('File cadangan tidak valid.')}};rd.readAsText(fl)};
 bk.append(b1,el('div','mut','Pulihkan dari file cadangan:'),fi);m.append(bk);
}
// ---- lock
function unlock(){if($('#pin').value===S.pin){$('#lock').style.display='none';$('#pin').value='';$('#lerr').textContent=''}else $('#lerr').textContent='PIN salah.'}
$('#go').onclick=unlock;$('#pin').onkeydown=e=>{if(e.key==='Enter')unlock()};
nav();draw();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
